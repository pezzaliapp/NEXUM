# Contesto di esposizione (WORLD pubblicato): violence → cities50, entro 25 km. Configurazione, non codice del Core.
[rule]
id = "violence_cities50_exposure"
version = "1"
label = "Centri abitati vicino a violenza organizzata"
output = "context"
anchor = "A"
strength = 0.6
emit_threshold = 0.3
max_candidates = 4000
collect = { var = "O", limit = 20 }
explain = "Entro {radius|num0} km dall' evento di violenza organizzata «{A.label}» ({A.prop.deaths_best|num0} morti secondo UCDP, {A.time|date}) si trovano {n.O} centri abitati con più di 50.000 abitanti; il più vicino è {first.O.label} ({first.O.prop.population|num0} abitanti) a {first.O.dist|num1} km. Contesto di esposizione: vicinanza registrata, non una stima di danni né un rapporto di causa."

[[rule.var]]
name = "A"
kind = "event"
types = ["conflict.violence_event"]


[[rule.var]]
name = "O"
kind = "object"
types = ["place.settlement"]
where = [["population", ">=", 50000]]

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "O"
km = 25
score = true
