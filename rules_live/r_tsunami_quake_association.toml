# Associazione: un tsunami registrato da NOAA NCEI vicino nel tempo (−10 min … +6 h) e nello spazio (≤ 500 km) a un
# terremoto USGS. Associazione spazio-temporale tra due fonti, non un rapporto di causa verificato da NEXUM.
[rule]
id = "tsunami_quake_association"
version = "1"
label = "Associazione: tsunami e terremoto"
output = "association"
anchor = "B"
unique = true
strength = 0.8
emit_threshold = 0.3
max_candidates = 500
explain = "Il tsunami «{B.label}» (altezza massima dell'acqua {B.prop.max_water_height_m|num1} m secondo NOAA NCEI) è registrato {dt.A.B|delta} dopo il terremoto M{A.prop.magnitude|num1} USGS del {A.time|date}, a {dist.A.B|num1} km dall'epicentro. Associazione spazio-temporale tra due fonti, non un rapporto di causa verificato."

[[rule.var]]
name = "B"
kind = "event"
types = ["hydro.tsunami"]

[[rule.var]]
name = "A"
kind = "event"
types = ["seismic.earthquake"]
where = [["magnitude", ">=", 6.0]]

[[rule.constraint]]
op = "within_time"
a = "A"
b = "B"
min = "-10m"
max = "6h"
score = true

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "B"
km = 500
score = true
