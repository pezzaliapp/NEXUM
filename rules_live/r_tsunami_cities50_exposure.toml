# Contesto di esposizione (WORLD pubblicato): tsunami → cities50, entro 100 km. Configurazione, non codice del Core.
[rule]
id = "tsunami_cities50_exposure"
version = "1"
label = "Centri abitati vicino a un tsunami"
output = "context"
anchor = "A"
strength = 0.6
emit_threshold = 0.3
max_candidates = 4000
collect = { var = "O", limit = 20 }
explain = "Entro {radius|num0} km dall'origine dello tsunami «{A.label}» ({A.time|date}) si trovano {n.O} centri abitati con più di 50.000 abitanti; il più vicino è {first.O.label} ({first.O.prop.population|num0} abitanti) a {first.O.dist|num1} km. Contesto di esposizione: vicinanza registrata, non una stima di danni né un rapporto di causa."

[[rule.var]]
name = "A"
kind = "event"
types = ["hydro.tsunami"]


[[rule.var]]
name = "O"
kind = "object"
types = ["place.settlement"]
where = [["population", ">=", 50000]]

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "O"
km = 100
score = true
