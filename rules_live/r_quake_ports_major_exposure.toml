# Contesto di esposizione (WORLD pubblicato): quake → ports_major, entro 100 km. Configurazione, non codice del Core.
[rule]
id = "quake_ports_major_exposure"
version = "1"
label = "Porti vicino a un terremoto"
output = "context"
anchor = "A"
strength = 0.6
emit_threshold = 0.3
max_candidates = 4000
collect = { var = "O", limit = 20 }
explain = "Entro {radius|num0} km dall'epicentro del terremoto M{A.prop.magnitude|num1} ({A.time|date}) si trovano {n.O} porti medi o grandi; il più vicino è {first.O.label} a {first.O.dist|num1} km. Contesto di esposizione: vicinanza registrata, non una stima di danni né un rapporto di causa."

[[rule.var]]
name = "A"
kind = "event"
types = ["seismic.earthquake"]
where = [["magnitude", ">=", 6.0]]

[[rule.var]]
name = "O"
kind = "object"
types = ["transport.port"]
where = [["harbor_size", "in", ["medio", "grande"]]]

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "O"
km = 100
score = true
