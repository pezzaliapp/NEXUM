# Contesto di esposizione: cosa c'è nell'area di un evento (seismic.earthquake) — centri abitati (Natural Earth).
# Regola di configurazione del WORLD pubblicato, non codice del Core. Il raggio è un parametro di questa regola.
[rule]
id = "quake_settlements_exposure"
version = "1"
label = "Centri abitati vicino a un terremoto"
output = "context"
anchor = "A"
strength = 0.6
emit_threshold = 0.3
max_candidates = 4000
collect = { var = "O", limit = 20 }
explain = "Entro {radius|num0} km dall'epicentro del terremoto M{A.prop.magnitude|num1} ({A.time|date}) si trovano {n.O} centri abitati con più di 100.000 abitanti; il più vicino è {first.O.label} ({first.O.prop.population|num0} abitanti) a {first.O.dist|num1} km. Informazione di contesto sull'esposizione, non una stima di danni."

[[rule.var]]
name = "A"
kind = "event"
types = ["seismic.earthquake"]
where = [["magnitude", ">=", 5.5]]

[[rule.var]]
name = "O"
kind = "object"
types = ["place.settlement"]
where = [["population", ">=", 100000]]

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "O"
km_steps = { var = "A", property = "magnitude", steps = [[5.5, 50], [6.5, 100], [7.5, 200]] }
score = true
