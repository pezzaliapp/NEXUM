# Contesto di esposizione: cosa c'è nell'area di un evento (weather.severe_storm) — centri abitati (Natural Earth).
# Regola di configurazione del WORLD pubblicato, non codice del Core. Il raggio è un parametro di questa regola.
[rule]
id = "storm_settlements_exposure"
version = "1"
label = "Centri abitati vicino a una tempesta"
output = "context"
anchor = "A"
strength = 0.6
emit_threshold = 0.3
max_candidates = 4000
collect = { var = "O", limit = 20 }
explain = "Entro {radius|num0} km dal punto di massima intensità della tempesta «{A.label}» (vento massimo {A.prop.max_wind_kts|num0} nodi, {A.time|date}) si trovano {n.O} centri abitati con più di 100.000 abitanti; il più vicino è {first.O.label} a {first.O.dist|num1} km. Il punto è quello di massima intensità registrata, non l'intero percorso. Contesto di esposizione, non una stima di danni."

[[rule.var]]
name = "A"
kind = "event"
types = ["weather.severe_storm"]
where = [["max_wind_kts", ">=", 64]]

[[rule.var]]
name = "O"
kind = "object"
types = ["place.settlement"]
where = [["population", ">=", 100000]]

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "O"
km = 150
score = true
