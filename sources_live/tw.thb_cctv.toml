id = "tw.thb_cctv"
name = "Highway Bureau (Taiwan) — CCTV snapshots"
owner = "Highway Bureau, MOTC, Taiwan"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-04"
independence_group = "tw_thb_cctv"
connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): CURRENT image (/snapshot) of the provincial highway cameras; licence compatible with CC BY 4.0.
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "OGDL-Taiwan-1.0"
url = "https://data.gov.tw/license"
attribution = "交通部公路局 Highway Bureau (Open Government Data License v1)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["cctv-maintain.thb.gov.tw"]

[politeness]
min_interval_s = 86400
max_rps = 0.5
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

[options]
