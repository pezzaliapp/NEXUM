id = "caltrans.cctv"
name = "Caltrans CWWP2 — CCTV (current still images)"
owner = "California Department of Transportation"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "caltrans_cctv"
