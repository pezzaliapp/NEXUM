id = "es.meteogalicia"
name = "MeteoGalicia — weather cameras"
owner = "Xunta de Galicia"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-04"
independence_group = "es_meteogalicia"
connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): CURRENT image of the weather cameras, published for third-party applications.
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "CC-BY-SA-4.0"
url = "https://abertos.xunta.gal/"
attribution = "MeteoGalicia – Xunta de Galicia (CC BY-SA 4.0)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["servizos.meteogalicia.gal"]

[politeness]
min_interval_s = 86400
max_rps = 0.5
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

