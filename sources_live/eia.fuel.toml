id = "eia.fuel"
name = "U.S. EIA — Weekly retail gasoline and diesel prices (national average)"
owner = "U.S. Energy Information Administration"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "us_eia"
connector = "connectors.eia_fuel"

# Phase 3B · block 4: national average retail fuel prices as the authority publishes them (unit and currency of the
# source, no conversion between currencies). Coverage of all fuel sources: 31 of 193 states — never "worldwide".
[license]
id = "US-PD"
url = "https://www.eia.gov/about/copyrights_reuse.php"
attribution = "Source: U.S. Energy Information Administration (public domain)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
# the public weekly history tables are HTML (no API key); "csv" is the nearest tabular access type of the registry
type = "csv"
auth = "none"
allowed_hosts = ["www.eia.gov"]

[politeness]
min_interval_s = 604800
max_rps = 0.05
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 604800

[options]
