id = "desnz.fuel"
name = "DESNZ — Weekly road fuel prices (UK)"
owner = "UK Department for Energy Security and Net Zero"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "desnz"
connector = "connectors.desnz_fuel"

# Phase 3B · block 4: national average retail fuel prices as the authority publishes them (unit and currency of the
# source, no conversion between currencies). Coverage of all fuel sources: 31 of 193 states — never "worldwide".
[license]
id = "OGL-UK-3.0"
url = "https://www.nationalarchives.gov.uk/doc/open-government-licence/version/3/"
attribution = "Source: Department for Energy Security and Net Zero, licensed under the Open Government Licence v3.0"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "csv"
auth = "none"
allowed_hosts = ["www.gov.uk", "assets.publishing.service.gov.uk"]

[politeness]
min_interval_s = 604800
max_rps = 0.05
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 604800

