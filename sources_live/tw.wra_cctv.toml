id = "tw.wra_cctv"
name = "Water Resources Agency (Taiwan) — river cameras"
owner = "Water Resources Agency, MOEA, Taiwan"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-04"
independence_group = "tw_wra_cctv"
connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): CURRENT image of the river and hydraulic-works cameras.
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "OGDL-Taiwan-1.0"
url = "https://data.gov.tw/license"
attribution = "經濟部水利署 Water Resources Agency (Open Government Data License v1)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["opendata.wra.gov.tw"]

[politeness]
min_interval_s = 86400
max_rps = 0.5
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

[options]
