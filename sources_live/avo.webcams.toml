id = "avo.webcams"
name = "Alaska Volcano Observatory — volcano webcams (non-FAA)"
owner = "Alaska Volcano Observatory (USGS / UAF Geophysical Institute / ADGGS)"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "avo"
connector = "connectors.avo_webcams"

# Phase 3B · block 1: camera positions and the stable URL of the CURRENT image only. Image bytes are never fetched,
# copied or archived by NEXUM; the browser loads the image from this source only when the person opens the camera.
[license]
id = "public-domain-us-gov"
url = "https://avo.alaska.edu/"
attribution = "Alaska Volcano Observatory / U.S. Geological Survey"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["avo.alaska.edu"]

[politeness]
min_interval_s = 86400
max_rps = 0.2
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

[options]
