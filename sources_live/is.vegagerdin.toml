id = "is.vegagerdin"
name = "Vegagerðin — road webcams (Iceland)"
owner = "Vegagerðin (Icelandic Road and Coastal Administration)"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "is_vegagerdin"
connector = "connectors.open_webcams"

# World Intelligence (2026-10-03): positions and the stable URL of each camera's CURRENT still image; the image itself
# is loaded by the browser from the publisher only when the person opens the camera (never copied, never archived).
[license]
id = "CC-BY-4.0"
url = "https://www.vegagerdin.is/vegagerdin/gagnasafn/vefthjonustur/terms-and-conditions"
attribution = "Vegagerðin (IRCA) – Vefmyndavélar, CC BY 4.0 (with the download date)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["gagnaveita.vegagerdin.is"]

[politeness]
min_interval_s = 604800
max_rps = 0.2
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 604800

