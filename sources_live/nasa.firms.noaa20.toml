id = "nasa.firms.noaa20"
name = "NASA FIRMS — active fire hotspots, last 24 hours (VIIRS 375 m, NOAA-20)"
owner = "NASA LANCE / FIRMS"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-22"
independence_group = "nasa_firms"
connector = "connectors.firms_hotspots"

# OSIRIS baseline (2026-10-04): thermal anomalies of the last 24 hours, published as one table (GET /tables/hotspots)
# drawn on request; never stored as NEXUM events (a hotspot is a detection, not a confirmed fire). The open global
# 24-hour CSV files of the FIRMS site need no key; the files are refreshed several times a day. 2026-10-22: NOAA-20,
# its own source so that it is fetched, judged and signalled apart from NOAA-21 (nasa.firms), with which it publishes
# the table "hotspots"; it replaces Suomi NPP (NASA ends its data delivery on 2 November 2026; NASA's advice: move to
# NOAA-21 and NOAA-20; FIRMS product VJ114IMGTDL_NRT, DOI 10.5067/FIRMS/VIIRS/VJ114IMGT_NRT.002).
[license]
id = "nasa-open-data"
url = "https://www.earthdata.nasa.gov/engage/open-data-services-software-policies/data-use-guidance"
attribution = "Hotspots: NASA FIRMS (LANCE), VIIRS 375 m (NOAA-20)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "csv"
auth = "none"
allowed_hosts = ["firms.modaps.eosdis.nasa.gov"]

[politeness]
min_interval_s = 10800
max_rps = 0.1
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 10800

[options]
published_table = "hotspots"
satellite = "noaa20"
