connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): LINK ONLY: images served over http only.
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "Generalitat-open-data"
url = "https://governobert.gencat.cat/ca/dades_obertes/llicencia/"
