id = "es.madrid_traffic"
name = "Ayuntamiento de Madrid — traffic cameras"
owner = "Ayuntamiento de Madrid"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-03"
independence_group = "es_madrid_traffic"
connector = "connectors.open_webcams"

# World Intelligence (2026-10-03): positions and the stable URL of each camera's CURRENT still image; the image itself
# is loaded by the browser from the publisher only when the person opens the camera (never copied, never archived).
[license]
id = "CC-BY-4.0"
url = "https://datos.madrid.es/dataset/202088-0-trafico-camaras"
attribution = "Ayuntamiento de Madrid – datos.madrid.es, CC BY 4.0"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["datos.madrid.es"]

[politeness]
min_interval_s = 604800
max_rps = 0.2
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 604800

[options]
