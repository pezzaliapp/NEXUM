id = "uk.tfl_jamcams"
name = "Transport for London — JamCams (traffic cameras)"
owner = "Transport for London"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-04"
independence_group = "uk_tfl_jamcams"
connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): CURRENT image, loaded from TfL by the browser on request; positions and image URLs from the TfL Unified API (registration recommended, not required).
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "OGL-UK-2.0-TfL"
url = "https://tfl.gov.uk/corporate/terms-and-conditions/transport-data-service"
attribution = "Powered by TfL Open Data"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["api.tfl.gov.uk"]

[politeness]
min_interval_s = 86400
max_rps = 0.5
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

[options]
