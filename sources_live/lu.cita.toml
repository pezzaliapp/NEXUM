id = "lu.cita"
name = "CITA (Luxembourg) — motorway cameras"
owner = "Administration des ponts et chaussées, Luxembourg"
verdict = "adopt"
reliability_tier = "T1"
verified_at = "2026-10-04"
independence_group = "lu_cita"
connector = "connectors.webcams_more"

# Observation coverage (2026-10-04): CURRENT image of the motorway cameras (KML on data.public.lu, CC0).
# Image bytes are never fetched, copied or archived by NEXUM.
[license]
id = "CC0-1.0"
url = "https://data.public.lu/"
attribution = "CITA – Administration des ponts et chaussées (data.public.lu, CC0)"
redistribution = "allowed_with_attribution"
commercial_use = "allowed"

[access]
type = "json"
auth = "none"
allowed_hosts = ["www.cita.lu"]

[politeness]
min_interval_s = 86400
max_rps = 0.5
conditional_get = true
respect_retry_after = true

[updates]
mode = "bulk"
min_poll_interval_s = 86400

[options]
