statistic = { kind = "text" }
unit = { kind = "text" }
frequency = { kind = "text" }
dataset = { kind = "text" }
comparable_series_id = { kind = "text" }
country_iso2 = { kind = "text" }
series = { kind = "list" }
latest_value = { kind = "float" }
latest_end = { kind = "text" }
estimate_flags = { kind = "list" }
