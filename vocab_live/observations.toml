# OSSERVAZIONI (Phase 3B · block 2): serie misurate e pubblicate da fonti con metodologia documentata.
# Due famiglie DISTINTE, mai mescolate né combinate in indici:
#   · observation.opinion_series  — PERCEZIONE: risposte a sondaggi (quota, saldo); campione, domanda, campo;
#   · observation.official_series — REALTÀ: statistiche ufficiali (inflazione, disoccupazione…).
# Nessuna geometria propria: si leggono dal Paese ("misurato in"), non sono livelli della mappa.
# "series" = [[inizio periodo, fine periodo, valore, n, errore standard], …] in ordine di tempo (n/SE se pubblicati).
[object_type."observation.opinion_series"]
label = "Indicatore d'opinione"
geometry = "none"
identity_schemes = ["obs_series"]
display = { family = "observation", density_priority = 9, group = "Opinione pubblica", map = false, series = { property = "series", kind = "survey" }, facts = [{ property = "question", label = "Domanda" }, { property = "answer", label = "Risposta" }, { property = "population", label = "Popolazione" }, { property = "method", label = "Metodo" }, { property = "dataset", label = "Rilevazione" }] }
[object_type."observation.opinion_series".properties]
indicator = { kind = "text" }
indicator_label = { kind = "text" }
topic = { kind = "text" }
question = { kind = "text" }
answer = { kind = "text" }
statistic = { kind = "text" }
unit = { kind = "text" }
population = { kind = "text" }
method = { kind = "text" }
probability_sample = { kind = "bool" }
seasonal = { kind = "text" }
compare = { kind = "text" }
dataset = { kind = "text" }
comparable_series_id = { kind = "text" }
country_iso2 = { kind = "text" }
series = { kind = "list" }
latest_value = { kind = "float" }
latest_end = { kind = "text" }
rank = { kind = "int" }

[object_type."observation.official_series"]
label = "Indicatore statistico ufficiale"
geometry = "none"
identity_schemes = ["obs_series"]
display = { family = "observation", density_priority = 9, group = "Realtà · dati ufficiali", map = false, series = { property = "series", kind = "official" }, facts = [{ property = "definition", label = "Definizione" }, { property = "dataset", label = "Dataset" }] }
[object_type."observation.official_series".properties]
indicator = { kind = "text" }
indicator_label = { kind = "text" }
topic = { kind = "text" }
