# Pericoli naturali del WORLD pubblicato (NASA EONET) — tipi di dominio, fuori dal Core.
# "severity" è il valore generico normalizzato 0–1 dichiarato dal tipo (il Core non ne conosce il significato).

[event_type."volcanic.activity"]
label = "Attività vulcanica"
geometry = "point"
identity_schemes = ["eonet"]
roles = ["location", "nearest_location", "at_volcano"]
display = { family = "natural_event", density_priority = 2, group = "Vulcani", headline = [], facts = [{ property = "eonet_sources", label = "Segnalato da" }] }
[event_type."volcanic.activity".properties]
open = { kind = "bool" }
category = { kind = "text" }
eonet_sources = { kind = "list" }
closed = { kind = "text" }
positions = { kind = "int" }
volcano_number = { kind = "text" }

[event_type."fire.wildfire"]
label = "Incendio"
geometry = "point"
identity_schemes = ["eonet"]
roles = ["location", "nearest_location"]
severity = { property = "size_class", min = 2.0, max = 6.0, clamp = true }
display = { family = "natural_event", density_priority = 2, group = "Incendi", headline = [{ property = "area_km2", suffix = " km² bruciati", digits = 0 }], facts = [{ property = "area_km2", label = "Area", unit = "km²", digits = 1 }, { property = "eonet_sources", label = "Segnalato da" }] }
[event_type."fire.wildfire".properties]
open = { kind = "bool" }
category = { kind = "text" }
eonet_sources = { kind = "list" }
closed = { kind = "text" }
positions = { kind = "int" }
area_km2 = { kind = "float", unit = "km2" }
size_class = { kind = "float", unit = "log10 acri" }

[event_type."weather.severe_storm"]
label = "Tempesta / ciclone"
geometry = "point"
identity_schemes = ["eonet"]
roles = ["location", "nearest_location"]
severity = { property = "max_wind_kts", min = 34.0, max = 150.0, clamp = true }
display = { family = "natural_event", density_priority = 2, group = "Meteo / tempeste", headline = [{ property = "max_wind_kts", prefix = "vento ", suffix = " nodi", digits = 0 }], facts = [{ property = "max_wind_kts", label = "Vento massimo", unit = "nodi", digits = 0 }, { property = "positions", label = "Posizioni registrate", digits = 0 }, { property = "eonet_sources", label = "Segnalato da" }] }
[event_type."weather.severe_storm".properties]
open = { kind = "bool" }
track_start = { kind = "text" }
track_end = { kind = "text" }
position_shown = { kind = "text" }
category = { kind = "text" }
eonet_sources = { kind = "list" }
closed = { kind = "text" }
positions = { kind = "int" }
max_wind_kts = { kind = "float", unit = "nodi" }
track = { kind = "list" }

[event_type."hydro.flood"]
label = "Inondazione"
geometry = "area"
identity_schemes = ["eonet"]
roles = ["location", "nearest_location"]
display = { family = "natural_event", density_priority = 2, group = "Inondazioni", headline = [], facts = [{ property = "eonet_sources", label = "Segnalato da" }] }
[event_type."hydro.flood".properties]
open = { kind = "bool" }
category = { kind = "text" }
eonet_sources = { kind = "list" }
closed = { kind = "text" }
positions = { kind = "int" }

[event_type."geo.landslide"]
label = "Frana"
geometry = "point"
identity_schemes = ["eonet"]
roles = ["location", "nearest_location"]
display = { family = "natural_event", density_priority = 2, group = "Frane", headline = [], facts = [{ property = "eonet_sources", label = "Segnalato da" }] }
[event_type."geo.landslide".properties]
open = { kind = "bool" }
category = { kind = "text" }
eonet_sources = { kind = "list" }
closed = { kind = "text" }
positions = { kind = "int" }

# NOAA NCEI — vulcani, eruzioni significative, tsunami, terremoti significativi (impatto registrato)
[object_type."geo.volcano"]
label = "Vulcano"
geometry = "point"
identity_schemes = ["ncei_volcano", "gvp"]
display = { family = "natural_feature", density_priority = 2, group = "Vulcani", headline = [{ property = "elevation", suffix = " m", digits = 0 }], facts = [{ property = "morphology", label = "Tipo" }, { property = "elevation", label = "Altitudine", unit = "m", digits = 0 }, { property = "status", label = "Stato" }] }
[object_type."geo.volcano".properties]
morphology = { kind = "text" }
elevation = { kind = "float", unit = "m" }
status = { kind = "text" }
country_name = { kind = "text" }
last_eruption_code = { kind = "text" }

[event_type."volcanic.eruption"]
