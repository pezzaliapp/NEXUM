# UCDP — violenza organizzata (eventi con almeno 5 morti, stima migliore)
[event_type."conflict.violence_event"]
label = "Violenza organizzata"
geometry = "point"
identity_schemes = ["ucdp_ged"]
roles = ["location", "nearest_location"]
severity = { property = "deaths_best", min = 5.0, max = 200.0, clamp = true }
display = { family = "conflict", density_priority = 2, group = "Violenza organizzata", headline = [{ property = "deaths_best", suffix = " morti registrati", digits = 0 }], facts = [{ property = "deaths_best", label = "Morti (stima migliore)", digits = 0 }, { property = "deaths_civilians", label = "di cui civili", digits = 0 }, { property = "deaths_low", label = "Stima minima", digits = 0 }, { property = "deaths_high", label = "Stima massima", digits = 0 }, { property = "violence_type", label = "Tipo" }, { property = "side_a", label = "Parte A" }, { property = "side_b", label = "Parte B" }] }
[event_type."conflict.violence_event".properties]
conflict_code = { kind = "text" }
violence_type = { kind = "text" }
conflict = { kind = "text" }
dyad = { kind = "text" }
side_a = { kind = "text" }
side_b = { kind = "text" }
deaths_best = { kind = "float", unit = "persone" }
deaths_high = { kind = "float", unit = "persone" }
deaths_low = { kind = "float", unit = "persone" }
deaths_civilians = { kind = "float", unit = "persone" }
country_name = { kind = "text" }
where_precision = { kind = "int" }
status = { kind = "text" }

# Registro di base per le zone di sicurezza (World Intelligence, 2026-10-03): per Paese e file UCDP, ogni evento letale
# (≥ 1 morto stimato) in forma compatta. Non è un elemento della mappa: le zone ROSSE/ARANCIONI si calcolano da qui con
# regole dichiarate (90 giorni, unità amministrativa di primo livello), mai una previsione.
[object_type."conflict.event_digest"]
label = "Registro UCDP degli eventi letali"
geometry = "none"
identity_schemes = ["ucdp_digest"]
display = { family = "event", density_priority = 9, group = "Sicurezza · registro UCDP", map = false, digest = true, facts = [{ property = "country_name", label = "Paese (UCDP)" }, { property = "file", label = "File UCDP" }, { property = "events_n", label = "Eventi letali", digits = 0 }, { property = "first", label = "Dal" }, { property = "last", label = "Al" }] }
[object_type."conflict.event_digest".properties]
country_name = { kind = "text" }
gw = { kind = "int" }
file = { kind = "text" }
fields = { kind = "list" }
events = { kind = "list" }
events_n = { kind = "int" }
first = { kind = "text" }
last = { kind = "text" }
