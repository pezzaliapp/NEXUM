[event_type."volcanic.eruption".properties]
volcano_name = { kind = "text" }
vei = { kind = "float", unit = "VEI" }
agent = { kind = "text" }
country_name = { kind = "text" }
deaths = { kind = "float", unit = "persone" }
deathsTotal = { kind = "float", unit = "persone" }
injuries = { kind = "float", unit = "persone" }
injuriesTotal = { kind = "float", unit = "persone" }
damageMillionsDollars = { kind = "float", unit = "milioni USD" }
damageMillionsDollarsTotal = { kind = "float", unit = "milioni USD" }
housesDestroyed = { kind = "float" }
housesDestroyedTotal = { kind = "float" }
missing = { kind = "float" }
missingTotal = { kind = "float" }
deathsAmountOrderTotal = { kind = "int" }
damageAmountOrderTotal = { kind = "int" }

