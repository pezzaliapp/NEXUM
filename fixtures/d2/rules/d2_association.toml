# Regola sintetica di scala (solo D2): produce circa 50.000 insight.
[rule]
id = "d2_association"
version = "1"
label = "Associazione sintetica"
output = "association"
anchor = "B"
unique = true
strength = 0.8
emit_threshold = 0.3
explain = "{B.label} associato a {A.label} ({dist.A.B|num1} km, {dt.A.B|delta}). Associazione, non un rapporto di causa verificato."

[[rule.var]]
name = "B"
kind = "event"
types = ["syn.e01"]

[[rule.var]]
name = "A"
kind = "event"
types = ["syn.e02"]

[[rule.constraint]]
op = "within_time"
a = "A"
b = "B"
min = "0h"
max = "12h"
score = true

[[rule.constraint]]
op = "within_distance"
a = "A"
b = "B"
km = 50
score = true
