# Variante: rules_v1_score_only
[rule]
id = "grouping_non_spatial"
version = "1"
label = "Associazione con raggruppamento (senza coordinate)"
output = "association"
anchor = "B"
unique = true
strength = 0.8
emit_threshold = 0.3
explain = "{B.label} associato a {A.label} ({dt.A.B|delta} prima). Associazione, non un rapporto di causa verificato."

[[rule.var]]
name = "B"
kind = "event"
types = ["syn.alert"]

[[rule.var]]
name = "A"
kind = "event"
types = ["syn.report"]

[[rule.constraint]]
op = "within_time"
a = "A"
b = "B"
min = "0d"
max = "3d"
score = true
